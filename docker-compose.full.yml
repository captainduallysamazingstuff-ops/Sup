version: '3.8'

networks:
  supervisor_net:

volumes:
  logs:

services:
  supervisor_backend:
    build: .
    container_name: supervisor_backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - supervisor_net
    volumes:
      - ./logs:/app/logs

  bot:
    image: python:3.11-slim
    container_name: bot
    working_dir: /app
    volumes:
      - ./bot.py:/app/bot.py
      - logs:/app/logs
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_API_URL=http://supervisor_backend:8000
    command: ["python", "bot.py"]
    restart: unless-stopped
    networks:
      - supervisor_net

  planner:
    build: .
    container_name: planner
    working_dir: /app
    volumes:
      - ./agents/planner:/app
      - logs:/app/logs
    entrypoint: ["python", "-m", "agents.planner"]
    restart: unless-stopped
    networks:
      - supervisor_net
    environment:
      - LOG_PATH=/app/logs/agent_planner.log

  scraper:
    build: .
    container_name: scraper
    working_dir: /app
    volumes:
      - ./agents/scraper:/app
      - logs:/app/logs
    entrypoint: ["python", "-m", "agents.scraper"]
    restart: unless-stopped
    networks:
      - supervisor_net
    environment:
      - TARGET_URL=https://pytorch.org/news/
      - OUTPUT_MARKDOWN=/app/output/news.md
      - LOG_PATH=/app/logs/agent_scraper.log

  file_writer:
    build: .
    container_name: file_writer
    working_dir: /app
    volumes:
      - ./agents/file_writer:/app
      - logs:/app/logs
    entrypoint: ["python", "-m", "agents.file_writer"]
    restart: unless-stopped
    networks:
      - supervisor_net
    environment:
      - DEST_DIR=/app/output
      - LOG_PATH=/app/logs/agent_file_writer.log

  scheduler:
    build: .
    container_name: scheduler
    working_dir: /app
    volumes:
      - ./agents/scheduler:/app
      - logs:/app/logs
    entrypoint: ["python", "-m", "agents.scheduler"]
    restart: unless-stopped
    networks:
      - supervisor_net
    environment:
      - APPROVAL_ENDPOINT=http://supervisor_backend:8000/approval
      - LOG_PATH=/app/logs/agent_scheduler.log
